<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>
<style>
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.container{background:white;width:90%;max-width:400px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1);overflow:hidden}
.header{background:#4a69ff;color:white;padding:20px;text-align:center}
.header img{width:80px;height:80px;border-radius:50%;background:white}
.chat-box{height:300px;overflow-y:auto;padding:15px}
.message{margin:10px 0;padding:10px 15px;border-radius:15px;max-width:80%}
.user{background:#4a69ff;color:white;margin-left:auto}
.bot{background:#e9e9eb}
.input-area{display:flex;padding:15px;border-top:1px solid #eee}
.input-area input{flex:1;padding:12px;border:1px solid #ddd;border-radius:25px}
.input-area button{margin-left:10px;padding:12px 20px;background:#4a69ff;color:white;border:none;border-radius:25px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<img src="chatbot.jpg">
<h2>AI Assistant</h2>
<p>Task-2 - Shiamaa</p>
</div>
<div class="chat-box" id="chatBox">
<div class="message bot">Hello! I'm your AI Assistant. How can I help you?</div>
</div>
<div class="input-area">
<input type="text" id="userInput" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>
</div>
<script>
function sendMessage(){
let input=document.getElementById('userInput');
let text=input.value.trim();
if(text=='') return;
let chatBox=document.getElementById('chatBox');
chatBox.innerHTML+=`<div class="message user">${text}</div>`;
input.value='';
setTimeout(()=>{
let replies=["That's interesting!","I'm here to help!","Great question!","Tell me more!"];
let reply=replies[Math.floor(Math.random()*replies.length)];
chatBox.innerHTML+=`<div class="message bot">${reply}</div>`;
chatBox.scrollTop=chatBox.scrollHeight;
},800);
}
</script>
</body>
  </html>
